services:
  mongo:
    image: mongo:7
    container_name: sms-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    image: himasmoh04/students-managment-system-himas:backend
    build: ./backend
    container_name: sms-backend
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/student_management
      CLIENT_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    image: himasmoh04/students-managment-system-himas:frontend
    build: ./frontend
    container_name: sms-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data: